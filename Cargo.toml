[package]
name = "herdr-agentview"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Centro de control de agentes para herdr: qué hace cada agente, en vivo, y cómo pararlo, hablarle o reanudarlo"

[dependencies]
anyhow = "1"
ratatui = "0.30"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
