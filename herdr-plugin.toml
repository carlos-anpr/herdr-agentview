id = "local.agentview"
name = "agentview"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]
description = "Centro de control de agentes: qué hace cada uno en vivo, y cómo hablarle, pararlo o reanudarlo."

# Compila el binario al instalar (requiere cargo). Con `herdr plugin link .` compílalo tú: `cargo build --release`.
[[build]]
command = ["cargo", "build", "--release", "--locked"]

# Ventana flotante (popup) sobre el panel activo; se cierra al salir.
[[panes]]
id = "viewer"
title = "agentview"
placement = "popup"
width = "94%"
height = "92%"
command = ["sh", "-c", "exec \"${HERDR_PLUGIN_ROOT}/target/release/herdr-agentview\""]

[[actions]]
id = "open"
title = "agentview: centro de control de agentes"
contexts = ["pane", "workspace"]
command = ["sh", "herdr/open.sh"]
